<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IEBC · Detalle de Facturas</title>
<style>
  :root{--navy:#1b1560;--navy2:#241aa8;--brand:#230BC5;--steel:#2f21c4;--teal:#0e9aa7;
    --green:#2e8b6b;--greenL:#e3f3ec;--red:#c0472f;--redL:#fbeae6;--amber:#d99a2b;--amberL:#fdf6e7;
    --ink:#1b2733;--muted:#6b7c8f;--line:#e4eaf0;--bg:#eef2f6;--card:#fff;
    --shadow:0 1px 3px rgba(16,42,67,.08),0 4px 16px rgba(16,42,67,.06)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto;padding:0 20px 60px}
  header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:20px 0 18px;margin-bottom:20px;box-shadow:0 2px 12px rgba(16,42,67,.18)}
  .hd{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  .logo{height:30px;width:auto;display:block;margin-bottom:9px}
  .hd h1{font-size:20px;font-weight:700}
  .hd .sub{font-size:12.5px;opacity:.85;margin-top:4px}
  .hd .sub b{color:#bfe3dd}
  .hd .badge{font-size:11.5px;background:#0e9aa7;color:#fff;padding:6px 12px;border-radius:20px;font-weight:600}

  .filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:16px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  select{font:inherit;font-size:13.5px;padding:8px 30px 8px 11px;border:1px solid #cdd8e3;border-radius:8px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236b7c8f'/></svg>") no-repeat right 11px center;appearance:none;-webkit-appearance:none;min-width:170px;max-width:280px;cursor:pointer;color:var(--ink)}
  select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(35,11,197,.12)}
  .btn-reset{font:inherit;font-size:12px;font-weight:600;color:var(--brand);background:none;border:none;cursor:pointer;padding:8px 4px;text-decoration:underline}
  .ms{position:relative;display:inline-block}
  .ms-btn{font:inherit;font-size:13.5px;padding:8px 30px 8px 11px;border:1px solid #cdd8e3;border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;min-width:190px;max-width:280px;text-align:left;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ms-btn::after{content:"▾";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:9px}
  .ms-btn:focus,.ms.open .ms-btn{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(35,11,197,.12)}
  .ms-pop{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:#fff;border:1px solid #cdd8e3;border-radius:10px;box-shadow:0 8px 26px rgba(16,42,67,.18);padding:8px;min-width:235px;display:none}
  .ms.open .ms-pop{display:block}
  .ms-pop label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 7px;border-radius:6px;cursor:pointer;color:var(--ink)}
  .ms-pop label:hover{background:#f2f5f9}
  .ms-pop .ms-all{font-weight:700;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:4px;padding-bottom:8px}
  .ms-list{max-height:232px;overflow:auto}
  .ms-pop input[type=checkbox]{accent-color:var(--brand);width:15px;height:15px;flex:none}
  .scope{margin-left:auto;align-self:center;font-size:11px;color:var(--muted);text-align:right}

  .kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--brand)}
  .kpi.a{border-left-color:var(--amber)} .kpi.r{border-left-color:var(--red)} .kpi.g{border-left-color:var(--green)}
  .kpi .lab{font-size:11px;color:var(--muted);font-weight:600}
  .kpi .val{font-size:22px;font-weight:750;margin-top:6px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .kpi .val small{font-size:12px;color:var(--muted);font-weight:600}
  .kpi .cap{font-size:10px;color:var(--muted);margin-top:3px}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:0}
  .tab{font:inherit;font-size:13px;font-weight:600;padding:11px 18px;border:1px solid var(--line);border-bottom:none;background:#e7ebf1;color:var(--muted);border-radius:10px 10px 0 0;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.12s}
  .tab:hover{background:#dde3ec}
  .tab.on{background:var(--card);color:var(--navy);box-shadow:0 -2px 0 var(--brand) inset}
  .tab .badge{font-size:10.5px;font-weight:700;background:#d3d9e3;color:#4a566b;padding:1px 8px;border-radius:20px}
  .tab.on .badge{background:var(--brand);color:#fff}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:16px 18px;box-shadow:var(--shadow)}
  .panel .desc{font-size:11.5px;color:var(--muted);margin-bottom:12px}
  .panel .desc b{color:var(--ink)}

  .tbl-scroll{max-height:520px;overflow:auto;border-radius:8px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;position:sticky;top:0;background:#fff;cursor:pointer;user-select:none;z-index:1}
  th.l,td.l{text-align:left}
  th:hover{color:var(--navy)}
  tbody tr:hover{background:#f6f9fc}
  .tfoot td{font-weight:700;border-top:2px solid var(--navy);border-bottom:none;background:#fafcfe;position:sticky;bottom:0}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px}
  .pill.b{background:#eceafc;color:var(--brand)} .pill.rd{background:#e5f5f4;color:#0b6b73}
  .pill.an{background:var(--amberL);color:#8a5a12} .pill.ot{background:#eef2f6;color:var(--muted)}
  .dchip{font-weight:700;padding:1px 7px;border-radius:5px;font-size:11.5px}
  .d0{background:var(--greenL);color:var(--green)} .d1{background:var(--amberL);color:#8a5a12} .d2{background:var(--redL);color:var(--red)}
  .muted{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:13px}

  .dias{margin-top:18px}
  .dias h3{font-size:14px;color:var(--navy);font-weight:700;margin-bottom:3px}
  .dias .sub{font-size:11px;color:var(--muted);margin-bottom:12px}
  .drow{display:grid;grid-template-columns:230px 1fr 96px;gap:12px;align-items:center;margin-bottom:9px;font-size:12px}
  .drow .cn{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drow .track{background:#eef2f6;border-radius:5px;height:20px;overflow:hidden}
  .drow .fillb{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;color:#fff;font-size:10.5px;font-weight:700}
  .drow .n{font-size:10.5px;color:var(--muted);text-align:right}
  .foot{margin-top:26px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:13px;line-height:1.6}
  .foot b{color:var(--ink)}
  @media(max-width:1000px){.kgrid{grid-template-columns:repeat(2,1fr)}.drow{grid-template-columns:150px 1fr 70px}}
</style>
</head>

const R=DATA.rows;
const fmt0=v=>(v/1e6).toLocaleString('es-AR',{maximumFractionDigits:0});
const fmt1=v=>(v/1e6).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtDate=iso=>{if(!iso)return '—';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y.slice(2);};
const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
const TIPO=t=>{const m={'Básico':'b','Redet.':'rd','Anticipo':'an','Desacopio':'an'};return m[t]||'ot';};
let selPer=new Set(),selUop=new Set(),fCom='ALL',tab=1,sortK=null,sortD=-1;

const TABS={
 1:{name:'Certificado pendiente de facturar',
    desc:'Certificados devengados que <b>todavía no se facturaron</b>. El monto es el saldo pendiente de facturar (neto).',
    cols:[['uop','UOP','l'],['com','Comitente','l'],['plab','Período','l'],['tipo','Tipo','tipo'],['cert','Certificado / a facturar','m']],
    sum:['cert']},
 2:{name:'Facturado (neto) pendiente de cobro',
    desc:'Facturas <b>emitidas y aún no cobradas</b> por completo. Saldo pendiente = facturado neto − cobrado neto. "Días" = antigüedad desde la fecha de factura.',
    cols:[['uop','UOP','l'],['com','Comitente','l'],['plab','Período','l'],['tipo','Tipo','tipo'],['comp','Comp.','l'],['ff','Fecha fact.','d'],['factN','Facturado','m'],['cobrN','Cobrado','m'],['scob','Saldo pend.','m'],['daging','Días','days']],
    sum:['factN','cobrN','scob']},
 3:{name:'Facturas cobradas',
    desc:'Facturas <b>cobradas</b>. "Días de pago" = fecha de pago − fecha de factura.',
    cols:[['uop','UOP','l'],['com','Comitente','l'],['plab','Período','l'],['tipo','Tipo','tipo'],['comp','Comp.','l'],['ff','Fecha fact.','d'],['fp','Fecha pago','d'],['factN','Facturado','m'],['dpago','Días pago','days']],
    sum:['factN']}
};

function baseFilter(r){
  if(selPer.size>0 && !selPer.has(r.pkey)) return false;
  if(selUop.size>0 && !selUop.has(r.uop)) return false;
  if(fCom!=='ALL' && r.com!==fCom) return false;
  return true;
}
const scoped=()=>R.filter(baseFilter);
const tabRows=t=>scoped().filter(r=>r.estado===t);

function daysClass(d){ if(d==null)return ''; return d<=30?'d0':(d<=90?'d1':'d2'); }

function renderKPIs(){
  const s=scoped();
  const s1=s.filter(r=>r.estado===1), s2=s.filter(r=>r.estado===2), s3=s.filter(r=>r.estado===3);
  const noFact=sum(s1,'cert');
  const pendPago=sum(s2,'scob');
  const cobrado=sum(s3,'cobrN')+sum(s2,'cobrN');
  const cards=[
    {c:'a',lab:'Saldo certificado NO facturado',val:noFact,cap:s1.length+' certificados pendientes de facturar'},
    {c:'r',lab:'Facturado pendiente de pago',val:pendPago,cap:s2.length+' facturas por cobrar'},
    {c:'g',lab:'Cobrado (neto)',val:cobrado,cap:s3.length+' facturas cobradas'},
    {c:'',lab:'Certificado total (neto)',val:sum(s,'cert'),cap:s.length+' certificados en total'},
  ];
  document.getElementById('kpis').innerHTML=cards.map(k=>`
    <div class="kpi ${k.c}"><div class="lab">${k.lab}</div>
      <div class="val">$${fmt0(k.val)} <small>M</small></div><div class="cap">${k.cap}</div></div>`).join('');
}
function renderTabs(){
  document.getElementById('tabs').innerHTML=[1,2,3].map(t=>`
    <button class="tab ${t===tab?'on':''}" onclick="setTab(${t})">${TABS[t].name}
      <span class="badge">${tabRows(t).length}</span></button>`).join('');
}
function setTab(t){ tab=t; sortK=null; renderTabs(); renderTable(); }

function cellVal(r,c){
  const [k,,type]=c;
  if(type==='m') return '$'+fmt1(r[k]);
  if(type==='d') return fmtDate(r[k]);
  if(type==='tipo'){const cl=TIPO(r.tipo);return `<span class="pill ${cl}">${r.tipo}</span>`;}
  if(type==='days'){ if(r[k]==null)return '<span class="muted">—</span>'; return `<span class="dchip ${daysClass(r[k])}">${r[k]}</span>`;}
  if(k==='uop') return `<b>${r.uop}</b>`;
  if(k==='comp') return r.comp!=null?r.comp:'<span class="muted">—</span>';
  if(k==='com') return `<span style="font-size:11px">${r[k]}</span>`;
  return r[k]!=null?r[k]:'—';
}
function renderTable(){
  const T=TABS[tab]; let rows=tabRows(tab);
  document.getElementById('tabDesc').innerHTML=T.desc;
  if(sortK){ rows=rows.slice().sort((a,b)=>{const x=a[sortK],y=b[sortK];
    let r=(typeof x==='number'||typeof y==='number')?((x||0)-(y||0)):String(x||'').localeCompare(String(y||''));return r*sortD;});}
  else { rows=rows.slice().sort((a,b)=>(b.factN||b.cert)-(a.factN||a.cert)); }
  document.getElementById('thead').innerHTML=T.cols.map(c=>`<th class="${c[2]==='l'||c[2]==='tipo'?'l':''}" onclick="sortBy('${c[0]}')">${c[1]}${sortK===c[0]?(sortD<0?' ▾':' ▴'):''}</th>`).join('');
  document.getElementById('tbody').innerHTML= rows.length? rows.map(r=>`<tr>${T.cols.map(c=>`<td class="${c[2]==='l'||c[2]==='tipo'?'l':''}">${cellVal(r,c)}</td>`).join('')}</tr>`).join('')
    : `<tr><td class="empty" colspan="${T.cols.length}">Sin certificados para este filtro</td></tr>`;
  // footer sums
  const tf=T.cols.map((c,i)=>{
    if(i===0) return `<td class="l">TOTAL · ${rows.length}</td>`;
    if(T.sum.includes(c[0])) return `<td>$${fmt1(sum(rows,c[0]))}</td>`;
    return '<td></td>';
  }).join('');
  document.getElementById('tfoot').innerHTML=`<tr class="tfoot">${tf}</tr>`;
  renderDias();
}
function sortBy(k){ if(sortK===k)sortD*=-1; else{sortK=k;sortD=-1;} renderTable(); }

function renderDias(){
  const s3=scoped().filter(r=>r.estado===3 && r.dpago!=null);
  const by={};
  s3.forEach(r=>{(by[r.com]=by[r.com]||[]).push(r.dpago);});
  const arr=Object.entries(by).map(([c,l])=>({c,prom:l.reduce((a,b)=>a+b,0)/l.length,n:l.length})).sort((a,b)=>a.prom-b.prom);
  const mx=Math.max(30,...arr.map(a=>a.prom));
  const col=d=>d<=30?'#2e8b6b':(d<=90?'#d99a2b':'#c0472f');
  document.getElementById('diasBox').innerHTML = arr.length? arr.map(a=>`
    <div class="drow"><div class="cn" title="${a.c}">${a.c}</div>
      <div class="track"><div class="fillb" style="width:${Math.max(8,a.prom/mx*100).toFixed(0)}%;background:${col(a.prom)}">${a.prom.toFixed(0)} días</div></div>
      <div class="n">${a.n} fact.</div></div>`).join('')
    : '<div class="empty">Sin facturas cobradas en el filtro actual</div>';
  const all=s3.map(r=>r.dpago); 
  document.getElementById('diasSub').innerHTML = all.length
    ? `Días desde la fecha de factura hasta el cobro · solo facturas cobradas · <b>promedio general ${(all.reduce((a,b)=>a+b,0)/all.length).toFixed(0)} días</b> sobre ${all.length} facturas · según filtros`
    : 'Días desde la fecha de factura hasta el cobro · solo facturas cobradas · según filtros';
}

function opt(sel,val,cur){return `<option value="${val}"${val===cur?' selected':''}>`;}
function initFilters(){
  document.getElementById('perList').innerHTML=DATA.periodos.map(p=>`<label><input type="checkbox" class="perck" value="${p.key}" onchange="perToggle()"> ${p.lab}</label>`).join('');
  document.getElementById('uopList').innerHTML=DATA.uops.map(u=>`<label><input type="checkbox" class="uopck" value="${u}" onchange="uopToggle()"> <b style="min-width:52px;display:inline-block">${u}</b> <span style="color:var(--muted);font-size:11px">${String(DATA.uopdesc[u]||'').slice(0,24)}</span></label>`).join('');
  const co=document.getElementById('fCom');
  co.innerHTML='<option value="ALL">Todos los comitentes</option>'+DATA.comitentes.map(c=>`<option value="${c}">${c}</option>`).join('');


  co.onchange=e=>{fCom=e.target.value;renderAll();};
}
function resetF(){selPer.clear();selUop.clear();fCom='ALL';
  document.querySelectorAll('.perck').forEach(c=>c.checked=false);document.getElementById('perAll').checked=true;perLabelUpd();
  document.querySelectorAll('.uopck').forEach(c=>c.checked=false);document.getElementById('uopAll').checked=true;uopLabelUpd();
  document.getElementById('fCom').value='ALL';renderAll();}
function renderScope(){
  const p=[];
  p.push(selPer.size===0?'todos los períodos':(selPer.size===1?(DATA.periodos.find(x=>x.key===[...selPer][0])||{}).lab:selPer.size+' períodos'));
  p.push(selUop.size===0?'todas las obras':(selUop.size===1?[...selUop][0]:selUop.size+' obras'));
  p.push(fCom==='ALL'?'todos los comitentes':fCom);
  document.getElementById('scope').innerHTML='Mostrando: <b>'+p.join(' · ')+'</b>';
}
function renderAll(){ renderScope(); renderKPIs(); renderTabs(); renderTable(); }

function closeAllMS(except){ document.querySelectorAll('.ms').forEach(m=>{ if(m.id!==except) m.classList.remove('open'); }); }
function togglePerDD(e){ if(e)e.stopPropagation(); closeAllMS('msPer'); document.getElementById('msPer').classList.toggle('open'); }
function toggleUopDD(e){ if(e)e.stopPropagation(); closeAllMS('msUop'); document.getElementById('msUop').classList.toggle('open'); }
function uopAllToggle(cb){ if(cb.checked){ selUop.clear(); document.querySelectorAll('.uopck').forEach(c=>c.checked=false); } else { cb.checked=true; } uopLabelUpd(); renderAll(); }
function uopToggle(){ selUop.clear(); document.querySelectorAll('.uopck').forEach(c=>{ if(c.checked) selUop.add(c.value); }); document.getElementById('uopAll').checked=selUop.size===0; uopLabelUpd(); renderAll(); }
function uopLabelUpd(){ document.getElementById('uopBtn').textContent = selUop.size===0?'Todas las obras':(selUop.size===1?[...selUop][0]:selUop.size+' obras seleccionadas'); }
function perAllToggle(cb){ if(cb.checked){ selPer.clear(); document.querySelectorAll('.perck').forEach(c=>c.checked=false); } else { cb.checked=true; } perLabelUpd(); renderAll(); }
function perToggle(){ selPer.clear(); document.querySelectorAll('.perck').forEach(c=>{ if(c.checked) selPer.add(c.value); }); document.getElementById('perAll').checked=selPer.size===0; perLabelUpd(); renderAll(); }
function perLabelUpd(){ document.getElementById('perBtn').textContent = selPer.size===0?'Todos los períodos':(selPer.size===1?(DATA.periodos.find(x=>x.key===[...selPer][0])||{}).lab:selPer.size+' períodos seleccionados'); }
document.addEventListener('click',e=>{ document.querySelectorAll('.ms.open').forEach(m=>{ if(!m.contains(e.target)) m.classList.remove('open'); }); });
initFilters(); renderAll();
</script>

name: Actualizar Tableros IEBC

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5,11,14,17,20,23 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Download Excel from SharePoint
        run: |
          curl -L -o "Master UOPs.xlsx" \
            "https://365iebc-my.sharepoint.com/personal/mperez_iebc_com_ar/_layouts/15/download.aspx?share=IQCv-83aSjgTR7oz2AdaQkCEAQP48GfOKgD8_6lXY_YHjGc"
          echo "Excel downloaded: $(ls -la 'Master UOPs.xlsx')"
          file "Master UOPs.xlsx"

      - name: Run update script
        run: python actualizar_tableros.py --ruta-excel "Master UOPs.xlsx" --ruta-html . --no-push

      - name: Commit and push changes
        run: |
          git config user.name "IEBC Auto-Update"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Actualizacion automatica $(date -u -d '-3 hours' +'%d/%m/%Y %H:%M') (Buenos Aires)"
            git push
          fi
